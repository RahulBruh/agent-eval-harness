# Agent configurations to benchmark. A 2x2 ablation on Haiku isolates the effect of
# (a) restructured skill files and (b) progressive context loading; Sonnet checks model choice.
defaults:
  today: "2026-10-03"   # pinned so refund windows etc. are deterministic against the mock data

variants:
  v1-inline-haiku:        {model: claude-haiku-4-5-20251001, skills_dir: skills_v1, context_mode: inline_all}
  v1-progressive-haiku:   {model: claude-haiku-4-5-20251001, skills_dir: skills_v1, context_mode: progressive}
  v2-inline-haiku:        {model: claude-haiku-4-5-20251001, skills_dir: skills,    context_mode: inline_all}
  v2-progressive-haiku:   {model: claude-haiku-4-5-20251001, skills_dir: skills,    context_mode: progressive}
  v2-progressive-sonnet:  {model: claude-sonnet-5-5,         skills_dir: skills,    context_mode: progressive}
  # Same as v2-progressive-haiku, served through Amazon Bedrock (needs AWS credentials).
  v2-progressive-haiku-bedrock: {model: claude-haiku-4-5-20251001, skills_dir: skills, context_mode: progressive, provider: bedrock}
