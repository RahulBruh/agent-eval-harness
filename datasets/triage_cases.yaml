  - id: bill-09
    tags: [billing, hard]
    message: Refund my Season Pass S7 or I'm filing a chargeback with my bank today. maya.r@example.com, PC, ORD-49870.
    expect: {skill: billing, escalate: true, priority: P3}

  - id: bill-10
    tags: [billing, easy]
    message: Where can I find receipts for my past purchases?
    followups: ["riley.p@example.com on PC, it's just a general question."]
    expect: {skill: billing, escalate: false, priority: P4, kb_any: [KB-101]}

  - id: bill-11
    tags: [billing, multi-turn, smoke]
    message: I got double charged!!
