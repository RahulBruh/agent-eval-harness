# Labeled triage cases for skills-support-agent.
#
# Each expectation is derived from the skill rules + mock data (accounts.json, service_status.json),
# not from model output. Fields that are omitted under `expect` are not scored for that case.
#
#   skill:      expected skill name, or a list of acceptable names (multi-intent cases)
#   escalate:   expected escalate flag
#   priority:   expected priority, or a list of acceptable priorities
#   fields:     {field: [acceptable substrings]} matched case-insensitively against extracted values
#   kb_any:     at least one of these KB IDs must be cited
#   reply_must_not_contain: case-insensitive substrings that must not appear in the reply
#
# Tags: domain (billing/account/bug/connectivity/general/multi), difficulty (easy/hard), and
# special sets: smoke (CI subset), injection, multi-turn.
#
# Label changelog (labels are only changed when the *label* was ambiguous, never to match a model):
#   2026-10-03  bug-10: priority P3 -> [P3, P4]. A wrong leaderboard time is defensibly 'minor' (P4)
#               or 'gameplay-affecting' (P3) under the bug-report rules.

cases:
  # ------------------------------------------------------------------ billing
  - id: bill-01
    tags: [billing, easy, smoke]
    message: I was charged twice for 1000 Shards on Sept 28. My account is maya.r@example.com and I play on PC.
    followups: ["It's a duplicate charge, both were 1000 Shards on Sept 28."]
    expect: {skill: billing, escalate: true, priority: P2, fields: {account_id: [maya.r@example.com, acc-1001], platform: [pc]}}

  - id: bill-02
