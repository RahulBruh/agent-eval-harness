[project]
name = "agent-eval-harness"
version = "0.1.0"
description = "Benchmark agent configurations on accuracy, tokens, cost and latency; gate regressions in CI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "skills-support-agent",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13",
]

[project.scripts]
evalh = "evalh.cli:app"

[tool.uv.sources]
skills-support-agent = { git = "https://github.com/RahulBruh/skills-support-agent", branch = "main" }

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evalh"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-third-party = ["support_agent"]
